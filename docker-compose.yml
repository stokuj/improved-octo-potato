services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/app}
      - ASYNC_DATABASE_URL=${ASYNC_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/app}
      - AUTH_SECRET=${AUTH_SECRET:-temporary-development-secret-must-be-32-chars}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-temporary-admin-session-secret-must-be-32-chars}
      - SQL_ECHO=${SQL_ECHO:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
