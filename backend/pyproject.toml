[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi-users[sqlalchemy]>=15.0.5",
    "fastapi[standard]>=0.135.3",
    "pydantic-settings>=2.13.1",
    "sqladmin>=0.24.0",
    "sqlmodel>=0.0.38",
    "psycopg[binary]>=3.2.4",
    "asyncpg>=0.30.0",
    "alembic>=1.13.1",
    "itsdangerous>=2.2.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "pytest-mock>=3.15.1",
    "pytest-repeat>=0.9.4",
]

[tool.coverage.run]
concurrency = ["greenlet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
