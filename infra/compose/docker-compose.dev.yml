# Development — all services in Docker with bind mounts for hot reload
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../../backend
    restart: unless-stopped
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
                    --proxy-headers --forwarded-allow-ips='*'"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}
      AUTH_SECRET: ${AUTH_SECRET:-temporary-development-secret-must-be-32-chars}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-temporary-admin-session-secret-32-chars}
      SQL_ECHO: ${SQL_ECHO:-false}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - ../../backend/app:/app/app:z
      - ../../backend/alembic:/app/alembic:z
      - ../../backend/seed.py:/app/seed.py:z
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      PUBLIC_API_URL: http://localhost:8000/api
      HOME: /root
      npm_config_cache: /root/.npm
    volumes:
      - ../../frontend:/app:z
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  discord_bot:
    build: ../../discord_bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      INGEST_TOKEN: ${INGEST_TOKEN:-temporary-ingest-token-must-be-32-chars-long-x}
      API_URL: http://backend:8000/api
    depends_on:
      - backend
    profiles: ["bot"]

volumes:
  postgres_dev_data:
  frontend_node_modules:
