[project]
name = "discord-bot"
version = "0.1.0"
description = "Discord slash-command bot for AH price entry"
requires-python = ">=3.13"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
